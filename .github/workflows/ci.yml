name: ci

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: 编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config python3 \
            libcmark-gfm-dev libcmark-gfm-extensions-dev libsource-highlight-dev

      # 一条 make：根 Makefile 是手写元层，先 bootstrap 出 tangle/Makefile，再转发。
      - name: 构建
        run: make

      - name: 语法与约束
        run: make check

      - name: 破点用例
        run: make test

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 编辑器语法
        run: |
          node tangle/editor/tools/gen-grammar.js
          node -e "JSON.parse(require('fs').readFileSync('tangle/editor/syntaxes/nw.tmLanguage.json','utf8'))"

      - name: 整站
        run: make web

      - name: 两个实现
        run: make crosscheck
