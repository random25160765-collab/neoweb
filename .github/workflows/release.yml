name: release

# 打 vX.Y.Z tag 即发布：两个平台的二进制包与一份编辑器插件，自动挂到 GitHub Release。
# 发布件不再手工搬运——CI 就是发布流程。

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  binary:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, platform: linux-x86_64 }
          - { os: macos-14, platform: macos-arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: 编译依赖（Linux）
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config python3 \
            libcmark-gfm-dev libcmark-gfm-extensions-dev libsource-highlight-dev

      # Homebrew 的 cmark-gfm 把核心库和扩展库装在一起，没有 Debian 那种拆分
      - name: 编译依赖（macOS）
        if: runner.os == 'macOS'
        run: brew install pkg-config cmark-gfm source-highlight

      - name: 破点展开
        run: find book -name '*.nw' -exec python3 nw3.py tangle -o . {} +

      - name: 构建
        run: make

      - name: 打包
        run: |
          ver="${GITHUB_REF_NAME#v}"
          dir="nw-$ver-${{ matrix.platform }}"
          pkg="$dir.tar.gz"
          mkdir "$dir"
          install -m 755 nw "$dir/nw"
          install -m 644 LICENSE "$dir/LICENSE"
          install -m 644 README.md "$dir/README.md"
          tar czf "$pkg" "$dir"
          if command -v sha256sum >/dev/null; then
            sha256sum "$pkg" > "$pkg.sha256"
          else
            shasum -a 256 "$pkg" > "$pkg.sha256"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: nw-${{ matrix.platform }}
          path: nw-*.tar.gz*

  editor-and-release:
    needs: binary
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config python3 \
            libcmark-gfm-dev libcmark-gfm-extensions-dev libsource-highlight-dev

      # 发布前完整走一遍构建链：发布件必须来自一个"整条链都是绿的"的提交
      - name: 破点展开
        run: find book -name '*.nw' -exec python3 nw3.py tangle -o . {} +

      - name: 构建
        run: make

      - name: 整站与对账
        run: |
          make web
          make crosscheck

      # 插件是目录形态的扩展（附录 C 的安装方式是软链进 extensions/），
      # 所以发布件是 editor/ 的压缩包，而不是 vsix——vsix 需要 marketplace 的账号体系。
      - name: 插件
        run: |
          node editor/tools/gen-grammar.js
          ver="${GITHUB_REF_NAME#v}"
          tar czf "nw-$ver-editor.tar.gz" editor

      - name: 收集产物
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: 发布到 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
            nw-*-editor.tar.gz
